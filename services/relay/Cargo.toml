[package]
name = "relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
futures-util = { version = "=0.3.34", features = ["sink"] }
messenger-protocol = { path = "../../crates/messenger-protocol", version = "=0.1.0" }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
