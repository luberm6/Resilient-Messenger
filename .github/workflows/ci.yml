name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.98.0

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo build --workspace --all-targets --locked
      - run: cargo run --locked -p messenger-protocol --example size_report
      - run: cargo run --locked -p messenger-crypto --example crypto_report

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: resilient
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: resilient_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resilient -d resilient_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://resilient:integration-only@127.0.0.1:5432/resilient_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.0 }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p core-api --test postgres -- --ignored --test-threads=1

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.0 }
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check
      - run: cargo install --locked cargo-audit --version 0.22.2
      - run: cargo audit

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: nightly-2026-08-20 }
      - run: cargo install --locked cargo-fuzz --version 0.13.2
      - run: cargo +nightly-2026-08-20 fuzz run decode -- -max_total_time=30
        working-directory: crates/messenger-protocol

  swift-and-ios-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.0 }
      - uses: Swatinem/rust-cache@v2
      - run: swift test --package-path apps/ios
      - run: brew install swiftlint
      - run: test "$(swiftlint version)" = "0.65.0"
      - run: swiftlint lint --strict --config .swiftlint.yml
      - run: scripts/test-swift-bindings.sh
      - run: scripts/build-ios-core.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: ios-xcframework
          path: |
            target/xcframework/ResilientMessengerCore.xcframework
            target/ios-bindings/messenger_uniffi.swift
          retention-days: 7

  kotlin-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.5.0 }
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.0 }
      - uses: Swatinem/rust-cache@v2
      - run: scripts/test-kotlin-bindings.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.5.0 }
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - run: gradle -p apps/android --no-daemon test lint assembleDebug
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.0 }
      - uses: Swatinem/rust-cache@v2
      - run: scripts/build-android-core.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: android-core-aar
          path: apps/android/core/build/outputs/aar/core-release.aar
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker/compose.yml config --quiet
      - run: docker compose -f infra/docker/compose.yml up -d --build
      - name: Wait for services
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null && curl --fail --silent http://127.0.0.1:8081/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f infra/docker/compose.yml logs
          exit 1
      - name: PostgreSQL restart recovery
        run: |
          docker compose -f infra/docker/compose.yml restart postgres
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f infra/docker/compose.yml logs
          exit 1
      - if: always()
        run: docker compose -f infra/docker/compose.yml down -v

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/check-no-secrets.sh
