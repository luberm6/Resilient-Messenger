[package]
name = "messenger-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = "=0.1.92"
ed25519-dalek = "=2.1.1"
futures-util = { version = "=0.3.34", features = ["sink"] }
messenger-protocol = { path = "../messenger-protocol", version = "=0.1.0" }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls"] }
thiserror = "=2.0.12"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time", "sync", "net"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[dev-dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }
