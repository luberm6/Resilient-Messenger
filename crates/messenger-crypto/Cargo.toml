[package]
name = "messenger-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
chacha20poly1305 = "=0.10.1"
messenger-identity = { path = "../messenger-identity", version = "=0.1.0" }
openmls = { version = "=0.9.0", default-features = false, features = ["0-8-1-storage-format"] }
openmls_basic_credential = { version = "=0.6.0", features = ["clonable"] }
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
thiserror = "=2.0.12"
tls_codec = "=0.5.0"
zeroize = "=1.9.0"
